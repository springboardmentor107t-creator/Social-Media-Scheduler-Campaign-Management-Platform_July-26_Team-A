<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="progressBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#2fbfa8" />
      <stop offset="100%" stop-color="#45dec4" />
    </linearGradient>
    
    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes progressAnim {
      from { width: 0%; }
      to { width: 100%; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    @keyframes ledPulse {
      0% { r: 5px; opacity: 0.7; }
      50% { r: 7px; opacity: 1; filter: drop-shadow(0 0 4px #10b981); }
      100% { r: 5px; opacity: 0.7; }
    }
    @keyframes textGlow {
      0% { text-shadow: 0 0 4px rgba(69,222,196,0.2); }
      50% { text-shadow: 0 0 12px rgba(69,222,196,0.7); }
      100% { text-shadow: 0 0 4px rgba(69,222,196,0.2); }
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      font-size: 24px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #8b949e;
      font-size: 13px;
    }
    .text-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 16px;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #c9d1d9;
      font-size: 13px;
    }
    .text-body-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #8b949e;
      font-size: 10.5px;
    }
    .progress-bar-fill {
      animation: progressAnim 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .pulse-glow-rect {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .led-green {
      fill: #10b981;
      animation: ledPulse 2s infinite ease-in-out;
    }
    .title-glow {
      animation: textGlow 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="796" height="496" rx="16" fill="url(#cardGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Inner Frame -->
  <rect x="10" y="10" width="780" height="480" rx="14" fill="none" stroke="#21262d" stroke-width="1" />

  <!-- Title Section -->
  <g transform="translate(40, 48)">
    <text class="text-title title-glow">🚀 SocialPilot – Milestone 3 Status Dashboard</text>
    <text class="text-subtitle" y="24">Infosys Springboard Internship • Team A • Status as of August 17, 2026</text>
  </g>

  <!-- Overall Progress Bar Container -->
  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="720" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <rect class="progress-bar-fill" x="0" y="0" width="720" height="24" rx="12" fill="url(#progressBar)" />
    <!-- Progress Indicator Label -->
    <text x="660" y="17" font-family="system-ui" font-weight="800" font-size="14px" fill="#ffffff">100%</text>
  </g>

  <!-- Columns (Database, Backend, Frontend) -->
  
  <!-- 1. Database Column (x: 40) -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="220" height="295" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="220" height="45" rx="12" fill="#21262d" opacity="0.4" />
    
    <!-- Header -->
    <text class="text-header" x="15" y="28">🗄️ Database Team</text>
    <text class="text-subtitle" x="170" y="28" fill="#10b981" font-weight="700">100%</text>
    
    <!-- Items -->
    <g transform="translate(15, 65)">
      <circle class="led-green" cx="5" cy="5" r="5" />
      <text class="text-body" x="20" y="9">PostgreSQL &amp; Mongo DB</text>

      <circle class="led-green" cx="5" cy="45" r="5" />
      <text class="text-body" x="20" y="49">DB Schema Created</text>

      <circle class="led-green" cx="5" cy="85" r="5" />
      <text class="text-body" x="20" y="89">SQLAlchemy ORM</text>

      <circle class="led-green" cx="5" cy="125" r="5" />
      <text class="text-body" x="20" y="129">Alembic Migrations</text>

      <circle class="led-green" cx="5" cy="165" r="5" />
      <text class="text-body" x="20" y="169">Seed &amp; Analytics Models</text>
    </g>
  </g>

  <!-- 2. Backend Column (x: 290) -->
  <g transform="translate(290, 160)">
    <rect x="0" y="0" width="220" height="295" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="220" height="45" rx="12" fill="#21262d" opacity="0.4" />
    
    <!-- Header -->
    <text class="text-header" x="15" y="28">⚙️ Backend Team</text>
    <text class="text-subtitle" x="170" y="28" fill="#10b981" font-weight="700">100%</text>
    
    <!-- Items -->
    <g transform="translate(15, 65)">
      <circle class="led-green" cx="5" cy="5" r="5" />
      <text class="text-body" x="20" y="9">FastAPI Project Setup</text>

      <circle class="led-green" cx="5" cy="40" r="5" />
      <text class="text-body" x="20" y="44">JWT Auth (Reg/Login)</text>

      <circle class="led-green" cx="5" cy="75" r="5" />
      <text class="text-body" x="20" y="79">RBAC Implementation</text>

      <circle class="led-green" cx="5" cy="110" r="5" />
      <text class="text-body" x="20" y="114">Campaigns &amp; Scheduling</text>
      <text class="text-body-sub" x="20" y="127">Post management APIs</text>

      <circle class="led-green" cx="5" cy="155" r="5" />
      <text class="text-body" x="20" y="159">Analytics &amp; Notifications</text>

      <circle class="led-green" cx="5" cy="190" r="5" />
      <text class="text-body" x="20" y="194">Swagger Docs</text>
    </g>
  </g>

  <!-- 3. Frontend Column (x: 540) -->
  <g transform="translate(540, 160)">
    <rect x="0" y="0" width="220" height="295" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="220" height="45" rx="12" fill="#21262d" opacity="0.4" />
    
    <!-- Header -->
    <text class="text-header" x="15" y="28">💻 Frontend Team</text>
    <text class="text-subtitle" x="170" y="28" fill="#10b981" font-weight="700">100%</text>
    
    <!-- Items -->
    <g transform="translate(15, 65)">
      <circle class="led-green" cx="5" cy="5" r="5" />
      <text class="text-body" x="20" y="9">Vite/React Architecture</text>

      <circle class="led-green" cx="5" cy="40" r="5" />
      <text class="text-body" x="20" y="44">Login &amp; Auth Screens</text>

      <circle class="led-green" cx="5" cy="75" r="5" />
      <text class="text-body" x="20" y="79">User Profile &amp; Settings</text>

      <circle class="led-green" cx="5" cy="110" r="5" />
      <text class="text-body" x="20" y="114">Campaigns &amp; Calendar UI</text>

      <circle class="led-green" cx="5" cy="145" r="5" />
      <text class="text-body" x="20" y="149">Role Controls &amp; Team Page</text>

      <circle class="led-green" cx="5" cy="180" r="5" />
      <text class="text-body" x="20" y="184">APIs Fully Integrated</text>
      <text class="text-body-sub" x="20" y="197">Backend &amp; DB Connected</text>
    </g>
  </g>

  <!-- Footer Info / Legend -->
  <g transform="translate(40, 475)">
    <circle cx="10" cy="-5" r="5" fill="#10b981" />
    <text class="text-subtitle" x="22" y="-1" fill="#10b981" font-weight="600">Completed (100%)</text>

    <text class="text-subtitle" x="430" y="-1" font-weight="700" fill="#10b981">✔ Final Milestone Progress: All Items Ready &amp; Integrated</text>
  </g>
</svg>
